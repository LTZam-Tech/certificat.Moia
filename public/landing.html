<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الشهادات — وزارة الشؤون الإسلامية والدعوة والإرشاد</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="masthead compact-header">
  <div class="compact-brand"><span id="pageTitle" data-ar="بوابة التدريب والشهادات" data-en="Training &amp; Certificate Portal">بوابة التدريب والشهادات</span></div>
  <input class="compact-search" type="search" id="trainSearch" data-ar-ph="ابحث في التدريبات" data-en-ph="Search trainings" aria-label="Search" placeholder="ابحث في التدريبات">
  <div class="compact-tools" aria-label="System tools">
    <button class="compact-tool" type="button" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none"><path d="M18 9a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="compact-tool" type="button" id="langBtn" title="Language" aria-label="Switch language">ع</button>
    <button class="compact-tool" type="button" title="Appearance" aria-label="Appearance">☼</button>
  </div>
</header>

<div class="app-shell" id="empShell">
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="/emblem.svg" alt="MOIA"></div>
    <nav class="sidebar-nav">
      <button class="side-link on" id="tabTrain">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span data-ar="التدريبات المتاحة" data-en="Available Trainings">التدريبات المتاحة</span>
      </button>
      <button class="side-link" id="tabMine">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9 14.5l1.8 1.8L15 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-ar="تدريباتي" data-en="My Trainings">تدريباتي</span>
      </button>
      <button class="side-link" id="tabCerts">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="5.2" stroke="currentColor" stroke-width="1.7"/><path d="M9 13.5L7.5 21l4.5-2.4 4.5 2.4-1.5-7.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span data-ar="شهاداتي" data-en="My Certificates">شهاداتي</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="profile-chip">
        <span class="profile-avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <span class="masked-id" style="color:#fff"><span class="dots">••••</span><span id="empIdLast4">••••</span></span>
      </div>
      <button class="side-signout" id="signOutBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 17l5-5-5-5M20 12H9M12 4H6a2 2 0 00-2 2v12a2 2 0 002 2h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-ar="تسجيل الخروج" data-en="Sign out">تسجيل الخروج</span>
      </button>
    </div>
  </aside>

  <main class="content-area">

    <section id="panel-train">
      <div class="section-label"><h2 data-ar="التدريبات المتاحة" data-en="Available Trainings">التدريبات المتاحة</h2></div>
      <div class="tgrid" id="trainList"></div>
      <div class="empty hidden" id="trainEmpty">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
        <h3 data-ar="لا توجد تدريبات مفتوحة حاليًا" data-en="No open trainings right now">لا توجد تدريبات مفتوحة حاليًا</h3>
        <p></p>
      </div>
    </section>

    <section id="panel-mine" class="hidden">
      <div class="section-label"><h2 data-ar="تدريباتي" data-en="My Trainings">تدريباتي</h2></div>
      <div id="mineList"></div>
      <div class="empty hidden" id="mineEmpty">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.6"/></svg></div>
        <h3 data-ar="لم تسجّل في أي تدريب بعد" data-en="You haven't registered for any training yet">لم تسجّل في أي تدريب بعد</h3>
        <p></p>
      </div>
    </section>

    <section id="panel-certs" class="hidden">
      <div class="section-label">
        <h2 data-ar="شهاداتك" data-en="Your certificates">شهاداتك</h2>
        <span class="count"></span>
      </div>

      <div class="cert-list" id="certList"></div>

      <div class="stream-note" id="streamNote"></div>

      <div class="empty hidden" id="emptyState">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2V7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <h3></h3>
        <p></p>
      </div>
    </section>
  </main>
</div>

<footer class="sig admin-footer">
  <div class="sig-inner">
    <div class="lock">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7"/></svg>
      <span data-ar="تُقدَّم الشهادات مباشرةً من مجلد الوزارة المشترك الآمن ولا يتم تخزينها في هذه البوابة." data-en="Certificates are served directly from the ministry's secure shared folder and are not stored in this portal.">تُقدَّم الشهادات مباشرةً من مجلد الوزارة المشترك الآمن ولا يتم تخزينها في هذه البوابة.</span>
    </div>
    <div class="gov"><b data-ar="الإدارة العامة لتقنية المعلومات" data-en="General Department of Information Technology">الإدارة العامة لتقنية المعلومات</b> <span data-ar="· خدمة داخلية" data-en="· Internal service">· خدمة داخلية</span></div>
  </div>
</footer>

<div class="toast" id="verifiedToast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none"><path d="M20 7L10 17l-5-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span data-ar="تم التحقق من الهوية" data-en="Identity verified">تم التحقق من الهوية</span>
</div>

<div class="toast" id="msgToast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v5.5M12 16.2v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span id="msgToastText"></span>
</div>

<script src="/i18n.js"></script>
<script src="/landing.js"></script>
</body>
</html>
